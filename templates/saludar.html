<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro realizado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body>
    <div class="contenedor">
        <h1>¡Hola {{ nombre }}!</h1>
        <p>Tu información fue registrada.</p>
        <h3>Pasatiempos</h3>
        <ul>
            {% for pasatiempo in pasatiempos %}
            <li>{{ pasatiempo }}</li>
            {% endfor %}
        </ul>
        <h3>Me gusta</h3>
        <p>{{ me_gusta }}</p>
        <p>
            <a href="/">Registrar otro alumno</a>
        </p>
        <p>
            <a href="/alumnos">Ver alumnos registrados</a>
        </p>
    </div>
</body>

</html>
